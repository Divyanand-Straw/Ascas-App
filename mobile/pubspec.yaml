name: ascas_app
description: "ASCAS Fertility Care Companion - Patient-focused mobile application for ASCAS Fertility and Women's Centre"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Navigation & Routing
  go_router: ^14.0.0

  # State Management
  flutter_riverpod: ^2.5.1

  # Networking
  dio: ^5.4.0
  http: ^1.2.0

  # UI & Styling
  google_fonts: ^6.2.0
  intl: ^0.19.0
  lucide_icons: ^0.257.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
